# Cloud Build → Docker → Artifact Registry → Cloud Run
# GitHub trigger sets COMMIT_SHA. For manual: gcloud builds submit --substitutions=COMMIT_SHA=$(git rev-parse HEAD)
#
# Sheets + GCS MVP deploy checklist: docs/deploy-sheets-mvp.md
#
# If the trigger runs as labor-catalog@gen-lang-client-0568373820.iam.gserviceaccount.com, that SA needs:
#   - roles/artifactregistry.writer on repository cloud-run-source-deploy (region europe-west1) — or push step fails
#   - roles/run.admin on the project — deploy step
#   - roles/iam.serviceAccountUser on 353363250924-compute@developer.gserviceaccount.com — deploy with --service-account
#   - roles/logging.logWriter on the project — build logs visible in console
#   - roles/secretmanager.secretAccessor on each secret referenced by _CLOUDRUN_SECRETS (deploy + runtime)
# One-shot (PowerShell): scripts/grant-labor-catalog-cloud-build-roles.ps1
#
# Runtime: _CLOUDRUN_ENV_VARS (non-sensitive) + _CLOUDRUN_SECRETS (Secret Manager).
# Format for _CLOUDRUN_SECRETS: VAR=SECRET_NAME:version,VAR2=SECRET2:version  (e.g. GOOGLE_PRIVATE_KEY=GOOGLE_PRIVATE_KEY:latest)
substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_PROJECT_ID: gen-lang-client-0568373820
  _AR_REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: install331/cwainstall-git
  _DEPLOY_REGION: europe-west1
  _SERVICE_NAME: install58
  _RUN_SERVICE_ACCOUNT: '353363250924-compute@developer.gserviceaccount.com'

  # --- Sheets + GCS MVP (default) — override per trigger if buckets/IDs differ ---
  _GCS_PROJECT_FILES_BUCKET: brightenlabor518
  _DATABASE_GCS_BUCKET: brightenlabor518
  _PROJECT_SETUP_SPREADSHEET_ID: 1hE-q1QVwk7piPSX-_ux1xEFUXdcr85p8Jqr5ODbhDQ8
  _VENDOR_INTAKE_SPREADSHEET_ID: 1hkRtCPCytPrDh7aQ9kEAbIa8prqindjV9W_VEvas_Vg
  _CATALOG_LABOR_SPREADSHEET_ID: 1mEGJVAus_gCs6QU1c3PgxapQp-5D9s2mej5OpE8xIKY
  _DIV10_INSTALL_INTELLIGENCE_SPREADSHEET_ID: 1GZXrFo0D_4TtkqxnFY8NLBXTCP33xwnpE4bPGmMVebE
  _GOOGLE_SERVICE_ACCOUNT_EMAIL: labor-catalog@gen-lang-client-0568373820.iam.gserviceaccount.com
  _AUTH_REQUIRED: '0'

  # Comma-separated KEY=VALUE (no spaces). Email must be plain env (not only a secret) alongside GOOGLE_PRIVATE_KEY.
  _CLOUDRUN_ENV_VARS: 'NODE_ENV=production,DB_DRIVER=sqlite,DATA_BACKEND=sheets,CATALOG_BACKEND=sheet,PROJECT_FILES_STORAGE=gcs,DIV10_BRAIN_ENABLED=0,CATALOG_SHEETS_SYNC_ENABLED=0,AUTO_SYNC_CATALOG_ON_START=0,DATABASE_GCS_OBJECT=estimator.db,DATABASE_GCS_BACKUP_INTERVAL_MS=30000,GOOGLE_SERVICE_ACCOUNT_EMAIL=labor-catalog@gen-lang-client-0568373820.iam.gserviceaccount.com,GOOGLE_SHEETS_READ_MIN_INTERVAL_MS=1500,UPLOAD_PDF_PROVIDER=google-document-ai,GOOGLE_CLOUD_PROJECT_ID=gen-lang-client-0568373820,DOCUMENT_AI_PROCESSOR_ID=7d47225afa5fabe8,DOCUMENT_AI_LOCATION=us'

  # Prefer full JSON secret (avoids PEM newline corruption). Create secret GOOGLE_SERVICE_ACCOUNT = entire .json file.
  # Legacy split-key: GOOGLE_PRIVATE_KEY=GOOGLE_PRIVATE_KEY:latest (PEM only, multiline — easy to break in Secret Manager).
  _CLOUDRUN_SECRETS: 'GOOGLE_SERVICE_ACCOUNT=GOOGLE_SERVICE_ACCOUNT:latest,AUTH_SESSION_SECRET=AUTH_SESSION_SECRET:latest'

  # Strip legacy Supabase/Postgres env from the service on deploy (first Sheets migration).
  _CLOUDRUN_REMOVE_ENV_VARS: 'DATABASE_URL,DIRECT_URL,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_JWT_SECRET,SUPABASE_STORAGE_BUCKET,CATALOG_SOURCE,CATALOG_ITEMS_TABLE,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY'

  # --- Legacy Supabase/pg profile (rollback only — do not use for Sheets MVP) ---
  # _CLOUDRUN_ENV_VARS: 'NODE_ENV=production,DB_DRIVER=pg,CATALOG_BACKEND=pg,CATALOG_SOURCE=supabase,CATALOG_ITEMS_TABLE=public.catalog_items_clean,CATALOG_SHEETS_SYNC_ENABLED=0,AUTO_SYNC_CATALOG_ON_START=0,SUPABASE_STORAGE_BUCKET=project-files'
  # _CLOUDRUN_SECRETS: 'GEMINI_API_KEY=GEMINI_API_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,DATABASE_URL=DATABASE_URL:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  - id: docker-auth
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - gcloud auth configure-docker $_AR_HOSTNAME --quiet

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA
      - .
    waitFor:
      - docker-auth

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA
    waitFor:
      - build

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        set -euo pipefail
        RUN_ENV="${_CLOUDRUN_ENV_VARS}"
        RUN_ENV="${RUN_ENV},GCS_PROJECT_FILES_BUCKET=${_GCS_PROJECT_FILES_BUCKET}"
        RUN_ENV="${RUN_ENV},DATABASE_GCS_BUCKET=${_DATABASE_GCS_BUCKET}"
        RUN_ENV="${RUN_ENV},PROJECT_SETUP_ESTIMATE_PROPOSAL_SPREADSHEET_ID=${_PROJECT_SETUP_SPREADSHEET_ID}"
        RUN_ENV="${RUN_ENV},VENDOR_INTAKE_BACKEND_SPREADSHEET_ID=${_VENDOR_INTAKE_SPREADSHEET_ID}"
        RUN_ENV="${RUN_ENV},CATALOG_LABOR_BACKEND_SPREADSHEET_ID=${_CATALOG_LABOR_SPREADSHEET_ID}"
        RUN_ENV="${RUN_ENV},DIV10_INSTALL_INTELLIGENCE_SPREADSHEET_ID=${_DIV10_INSTALL_INTELLIGENCE_SPREADSHEET_ID}"
        RUN_ENV="${RUN_ENV},AUTH_REQUIRED=${_AUTH_REQUIRED}"
        # GOOGLE_SERVICE_ACCOUNT_EMAIL is in _CLOUDRUN_ENV_VARS (required with GOOGLE_PRIVATE_KEY secret).

        DEPLOY_ARGS=(
          run deploy "${_SERVICE_NAME}"
          --project="${_AR_PROJECT_ID}"
          --region="${_DEPLOY_REGION}"
          --platform=managed
          --image="${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}"
          --service-account="${_RUN_SERVICE_ACCOUNT}"
          --port=8080
          --cpu-boost
          --timeout=300
          --set-env-vars="${RUN_ENV}"
          --quiet
        )
        if [ -n "${_CLOUDRUN_SECRETS}" ]; then
          DEPLOY_ARGS+=(--set-secrets="${_CLOUDRUN_SECRETS}")
        fi
        if [ -n "${_CLOUDRUN_REMOVE_ENV_VARS}" ]; then
          DEPLOY_ARGS+=(--remove-env-vars="${_CLOUDRUN_REMOVE_ENV_VARS}")
        fi
        gcloud "${DEPLOY_ARGS[@]}"
    waitFor:
      - push
